server:
  port: 8080

spring:
  application:
    name: wenyan-zhan
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/wenyan_zhan?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 'your-database-password'
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: input   # 使用雪花ID，禁止自增
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 雪花算法worker配置
snowflake:
  worker-id: 1
  data-center-id: 1

# OAuth第三方登录
oauth:
  wechat:
    app-id: 'your-wechat-appid'
    app-secret: 'your-wechat-secret'
  qq:
    app-id: 'your-qq-appid'
    app-secret: 'your-qq-secret'

# 讯飞ASR（密钥仅存后端，前端通过接口获取临时token）
xf-asr:
  app-id: 'your-xfyun-appid'
  api-key: 'your-api-key'
  api-secret: 'your-api-secret'

# 定时任务开启
scheduling:
  enabled: true

logging:
  level:
    com.wenyan: debug